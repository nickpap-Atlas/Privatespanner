<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private Spanner Client Garage</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: private client garage. Holdings first, each car opens a full asset page. Soft grey ground, hairline rules, thin serif numerals. */
:root {
  --bg: #EEEEEE;
  --panel: #F6F6F5;
  --panel-2: #E7E7E6;
  --line: #D3D3D3;
  --fg: #0E0E0E;
  --muted: #6A6A6A;
  --brass: #0E0E0E;
  --green: #0E0E0E;
  --good: #2E7D55;
  --warn: #9A6400;
  --bad: #B03A2E;
  --blue: #3B67A3;
  --violet: #6E4BA8;
  --display: "Cormorant Garamond", "Times New Roman", serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14.5px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand svg { width: 30px; height: 30px; }
.brand b { font: 500 15px var(--display); letter-spacing: .3em; }
.brand span { font: 500 10px var(--mono); letter-spacing: .16em; color: var(--muted); display: block; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs a { text-decoration: none; padding: 6px 12px; color: var(--muted); font-weight: 500; border-radius: 4px; }
nav.tabs a[aria-current="page"] { color: var(--fg); background: var(--panel-2); }
.data-menu { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

.btn { background: var(--panel-2); border: 1px solid var(--line); padding: 6px 12px; border-radius: 0; cursor: pointer; font-size: 13px; font-weight: 500; letter-spacing: .02em; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.danger { color: var(--bad); }

main { padding-block: 24px 64px; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(36px, 5.5vw, 60px); font-weight: 400; line-height: 1; letter-spacing: -.02em; }
h2 { font-size: 24px; font-weight: 500; letter-spacing: -.01em; }
.eyebrow { font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sample-note { font: 12px var(--mono); color: var(--warn); border: 1px dashed color-mix(in srgb, var(--warn) 50%, transparent); padding: 8px 12px; border-radius: 4px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 0; overflow: hidden; }
.kpi { background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi b { font: 500 32px/1.1 var(--display); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.01em; }
.kpi small { font: 12px var(--mono); }
.up { color: var(--good); } .down { color: var(--bad); }

.card { background: transparent; border: 1px solid var(--fg); border-radius: 0; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.cols { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
.cols-even { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.cols > *, .cols-even > * { min-width: 0; }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.r, th.r { text-align: right; }
tr.link { cursor: pointer; }
tr.link:hover td { background: var(--panel-2); }
.carname b { display: block; font-weight: 600; }
.carname span { font-size: 12px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11px var(--mono); letter-spacing: .06em; padding: 3px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.plain { color: var(--brass); }
.pill.plain::before { display: none; }

.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.alerts li { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.alerts li:last-child { border-bottom: none; }
.alerts .bar { align-self: stretch; border-radius: 2px; }
.alerts a { text-decoration: none; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { background: var(--panel-2); border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font: 500 26px/1.15 var(--display); font-variant-numeric: lining-nums tabular-nums; overflow-wrap: anywhere; }
.thumb { width: 64px; height: 44px; object-fit: cover; flex: none; }

.carname { display: flex; gap: 12px; align-items: center; }
.gallery { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.gallery figure { margin: 0; position: relative; overflow: hidden; background: var(--panel-2); }
.gallery figure img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .9s; cursor: zoom-in; }
.gallery figure:hover img { transform: scale(1.015); }
.gallery .main { aspect-ratio: 4 / 3; }
.gallery .side { display: grid; gap: 10px; grid-template-rows: repeat(2, minmax(0, 1fr)); min-height: 0; } .gallery .side figure { min-height: 0; } .gallery .side figure img { position: absolute; inset: 0; } body.showcase .sample-note, body.showcase .data-menu, body.showcase details.add, body.showcase .gallery .tools, body.showcase .btn.mini { display: none !important; }
.gallery .more { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; grid-column: 1 / -1; }
.gallery .more figure { aspect-ratio: 4 / 3; }
.gallery .tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity .3s; }
.gallery figure:hover .tools, .gallery figure:focus-within .tools { opacity: 1; }
.gallery .tools button { background: rgba(255,255,255,.92); border: 0; font: 500 11px var(--body); padding: 4px 8px; cursor: pointer; }
.gallery .empty-ph { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; aspect-ratio: 4 / 3; border: 1px dashed var(--line); }
@media (max-width: 700px) { .gallery { grid-template-columns: 1fr; } .gallery .side { grid-template-columns: 1fr 1fr; grid-template-rows: none; } .gallery .side figure { aspect-ratio: 4 / 3; } }
.stat small { color: var(--muted); font-size: 12px; }

.hero-car { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
.hero-car .value { text-align: right; }
.hero-car .value b { font: 400 clamp(36px, 5vw, 56px)/1 var(--display); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.01em; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.back { font: 500 12px var(--mono); color: var(--muted); text-decoration: none; letter-spacing: .08em; }
.back:hover { color: var(--brass); }

.highlights { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.highlights li::marker { color: var(--brass); }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font: 12px var(--mono); color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }

.owners { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.owner-card { text-decoration: none; }
.owner-card:hover { border-color: var(--brass); }
.owner-cars { display: flex; flex-direction: column; gap: 6px; }
.owner-cars div { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }

details.add { border-top: 1px dashed var(--line); padding-top: 12px; }
details.add summary { cursor: pointer; color: var(--brass); font-weight: 500; font-size: 13px; }
form.addf { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; align-items: end; }
form.addf label { display: flex; flex-direction: column; gap: 4px; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
form.addf input, form.addf select, form.addf textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: 13px; color: var(--fg); }
form.addf .wide { grid-column: 1 / -1; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--brass); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-weight: 600; }
.empty { color: var(--muted); font-size: 13px; }

/* Logbook */
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; border-radius: 99px; font: 500 12px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--brass); color: var(--fg); background: var(--panel-2); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 96px 14px 1fr auto; gap: 0 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 116px; top: 0; bottom: 0; width: 1px; background: var(--line); }
.timeline .when { font-size: 12px; padding: 12px 0; text-align: right; }
.timeline .when span { display: block; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.timeline .node { width: 11px; height: 11px; border-radius: 50%; background: var(--c); border: 2px solid var(--panel); margin-top: 15px; position: relative; z-index: 1; justify-self: center; }
.timeline .what { padding: 10px 0 14px; border-bottom: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.timeline li:last-child .what { border-bottom: none; }
.timeline .what p { margin: 0; color: var(--muted); font-size: 13px; }
.what-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.what-head a { font-size: 12px; text-decoration: none; }
.what-head a:hover { color: var(--brass); }
.tag { font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.meta { font: 11px var(--mono); color: var(--muted); }
.readings { display: flex; gap: 6px; flex-wrap: wrap; }
.readings span { background: var(--panel-2); border-radius: 4px; padding: 3px 8px; font-size: 12px; color: var(--muted); }
.readings b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.readings .low b { color: var(--warn); }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.thumbs img { width: 72px; height: 54px; object-fit: cover; border-radius: 3px; cursor: zoom-in; border: 1px solid var(--line); }
.btn.mini { padding: 0 7px; align-self: start; margin-top: 10px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bars div { display: grid; grid-template-columns: 90px 1fr 70px; gap: 10px; align-items: center; font-size: 12px; }
.bars i { display: block; height: 8px; border-radius: 2px; background: var(--c); min-width: 2px; }
.bars span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; }
@media (max-width: 600px) {
  .timeline li { grid-template-columns: 68px 12px 1fr auto; gap: 0 8px; }
  .timeline li::before { left: 81px; }
  .bars div { grid-template-columns: 80px 1fr 60px; }
}

@media (max-width: 900px) { .cols, .cols-even { grid-template-columns: 1fr; } .hero-car .value { text-align: left; } }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise .35s ease-out both; } @keyframes rise { from { transform: translateY(6px); } to { transform: none; } } }
body:not(.admin) .admin-only { display: none !important; }
body:not(.admin):not(.owner) nav.tabs { display: none; }
body.owner details.add, body.owner .gallery .tools, body.owner .btn.mini, body.owner [data-issue], body.owner #del-car, body.owner .owner-col { display: none !important; }
.gate { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 48px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.gate-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; text-align: left; }
.gate-logo { width: 150px; margin-bottom: 12px; }
.gate-card h1 { font-size: clamp(34px, 6vw, 48px); }
.gate-form { grid-template-columns: 1fr !important; }
.gate-msg { min-height: 1.4em; font-size: 13px; margin: 0; }
.linkish { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; justify-self: start; font-size: 13px; }
.linkbox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.demo-bar { background: var(--fg); color: var(--bg); }
.demo-bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px; font-size: 14px; }
.demo-bar .btn { background: transparent; color: var(--bg); border-color: var(--bg); }
.demo-bar .btn.primary { background: var(--bg); color: var(--fg); }
body.demo #signout { display: none !important; }
.linkbox input { flex: 1 1 260px; min-width: 0; font: 12px var(--body); padding: 8px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#portfolio" aria-label="Private Spanner garage home">
      <img src="img/mark-black.png" alt="" style="height:34px;width:auto">
      <div><b>PRIVATE SPANNER</b><span id="brand-sub">CLIENT GARAGE</span></div>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="#portfolio" data-nav="portfolio">Portfolio</a>
      <a href="#owners" data-nav="owners" class="admin-only">Owners</a>
      <a href="#logbook" data-nav="logbook">Logbook</a>
      <a href="index.html">Website</a>
    </nav>
    <div class="data-menu admin-only">
      <button class="btn" id="export" type="button">Export backup</button>
      <button class="btn" id="signout" type="button">Sign out</button>
    </div>
  </div>
</header>
<div class="demo-bar" id="demo-bar" hidden></div>
<section class="gate" id="gate" hidden></section>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden><img alt="Logbook photo"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---------- data: Supabase ----------
// The publishable key is meant to be public. Access is controlled by database rules:
// only the admin email can read or change data; owner links only return that owner's garage.
const SUPABASE_URL = "https://ybkfckpwydobxdllumom.supabase.co";
const SUPABASE_KEY = "sb_publishable_CPSpwrMTuspNRgo_pXW96w_wkK-KBDB";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TOKEN = new URLSearchParams(location.search).get("k");
// ?demo = example garage for prospects (read only). ?demo=admin = Marcus's view with sample data, nothing saved.
const DEMO = new URLSearchParams(location.search).get("demo");
const DEMO_ADMIN = DEMO === "admin";
const OWNER_MODE = !!TOKEN || (DEMO !== null && !DEMO_ADMIN);
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();

let DB = { owners: [], cars: [] };
let SAVED = {};   // "o:<id>" / "c:<id>" -> row JSON as last saved, so only changed rows are written

const OWNER_COLS = ["id", "name", "company", "phone", "email", "plan", "notes", "since"];
const ownerRow = o => Object.fromEntries(OWNER_COLS.map(k => [k, o[k] ?? null]));
const carRow = c => { const { id, ownerId, ...data } = c; return { id, owner_id: ownerId, data }; };
function normalize(c) {
  c.log ||= []; c.log.forEach((x, i) => x.id ||= c.id + "-" + i + "-" + x.date);
  c.photos ||= []; c.issues ||= []; c.comps ||= []; c.highlights ||= []; c.due ||= {}; c.values ||= [];
  c.outlook ||= { bear: -3, base: 0, bull: 3 }; c.specs ||= {}; c.purchase ||= { date: "", price: 0 };
  return c;
}
function snapshot() {
  SAVED = {};
  DB.owners.forEach(o => SAVED["o:" + o.id] = JSON.stringify(ownerRow(o)));
  DB.cars.forEach(c => SAVED["c:" + c.id] = JSON.stringify(carRow(c)));
}
async function loadAdmin() {
  const [o, c] = await Promise.all([sb.from("owners").select("*").order("created_at"), sb.from("cars").select("*").order("created_at")]);
  if (o.error || c.error) throw (o.error || c.error);
  DB = { owners: o.data, cars: c.data.map(r => normalize({ ...r.data, id: r.id, ownerId: r.owner_id })) };
  snapshot();
}
async function loadOwner() {
  const { data, error } = await sb.rpc("owner_garage", { token: TOKEN });
  if (error || !data) throw error || new Error("Garage not found");
  DB = { owners: [{ id: "me", ...data.owner }], cars: data.cars.map(c => normalize({ ...c, ownerId: "me" })) };
}

let saving = Promise.resolve();
function save() {
  if (OWNER_MODE || DEMO !== null) return saving;
  saving = saving.then(sync).catch(e => { console.error(e); toast("Couldn't save that change. Check your connection, then try again."); });
  return saving;
}
async function sync() {
  const now = {}, owners = [], cars = [];
  DB.owners.forEach(o => { const s = JSON.stringify(ownerRow(o)); now["o:" + o.id] = s; if (SAVED["o:" + o.id] !== s) owners.push(ownerRow(o)); });
  DB.cars.forEach(c => { const s = JSON.stringify(carRow(c)); now["c:" + c.id] = s; if (SAVED["c:" + c.id] !== s) cars.push(carRow(c)); });
  if (owners.length) { const { error } = await sb.from("owners").upsert(owners); if (error) throw error; }
  if (cars.length) { const { error } = await sb.from("cars").upsert(cars); if (error) throw error; }
  for (const k of Object.keys(SAVED).filter(k => !(k in now))) {
    const [t, id] = k.split(":");
    const { error } = await sb.from(t === "o" ? "owners" : "cars").delete().eq("id", id); if (error) throw error;
  }
  SAVED = now;
}

// Photos: resized in the browser, uploaded under a random name.
async function storePhoto(file, carId) {
  if (DEMO !== null) return shrink(file);
  const blob = await (await fetch(await shrink(file))).blob();
  const path = `${carId}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from("car-photos").upload(path, blob, { contentType: "image/jpeg" });
  if (error) throw error;
  return sb.storage.from("car-photos").getPublicUrl(path).data.publicUrl;
}
async function removeStored(url) {
  const m = String(url).match(/\/car-photos\/(.+)$/);
  if (m) await sb.storage.from("car-photos").remove([decodeURIComponent(m[1])]);
}
const ownerLink = o => DEMO !== null ? `${location.origin}${location.pathname}?demo` : `${location.origin}${location.pathname}?k=${o.share_token}`;

// ---------- sign-in gate ----------
function showGate(kind, msg = "") {
  document.body.classList.remove("admin", "owner"); document.body.classList.add("gated");
  $("#app").innerHTML = "";
  const g = $("#gate"); g.hidden = false;
  const logo = `<img src="img/logo-black.png" alt="Private Spanner" class="gate-logo">`;
  if (kind === "notfound") g.innerHTML = `<div class="gate-card">${logo}<h1>This garage link isn't valid.</h1><p class="muted">It may have been replaced with a new one. Please ask Marcus for your current link.</p><a class="btn" href="index.html">Back to the website</a></div>`;
  else if (kind === "denied") g.innerHTML = `<div class="gate-card">${logo}<h1>No access.</h1><p class="muted">This account isn't set up as a Private Spanner admin.</p><button class="btn" id="signout2" type="button">Sign out</button></div>`;
  else if (kind === "recover") g.innerHTML = `<div class="gate-card">${logo}<h1>Set a new password</h1>
    <form class="addf gate-form" id="pw-form"><label for="pw-new">New password<input id="pw-new" type="password" minlength="8" autocomplete="new-password" required></label>

function dueItems(c) {

}
function status(c) {

  const high = (c.issues || []).some(i => i.status === "Open" && i.severity === "High");
  if (high || soon <= 14) return ["bad", "Attention"];

  return ["good", "Good"];
}

// ---------- charts ----------
function niceTicks(lo, hi, n = 4) {
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const start = Math.floor(lo / step) * step, out = [];
  for (let v = start; v <= hi + step * 0.01; v += step) out.push(v);
  return out;
}
function lineChart(hist, proj) {
  const W = 680, H = 240, L = 58, R = 16, T = 14, B = 28;
  const pts = [...hist], all = [...hist.map(p => p[1])];
  let band = [];
  if (proj) { band = proj; band.forEach(p => all.push(p[1], p[3])); }
  const x0 = hist[0][0], x1 = proj ? proj.at(-1)[0] : hist.at(-1)[0];
  const ticks = niceTicks(Math.min(...all) * 0.92, Math.max(...all) * 1.04);
  const y0 = ticks[0], y1 = ticks.at(-1);
  const X = x => L + (x1 === x0 ? 0 : (x - x0) / (x1 - x0)) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const path = arr => arr.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Value chart">`;
  ticks.forEach(t => s += `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end" fill="var(--muted)" font-size="11" font-family="var(--mono)">${moneyK(t)}</text>`);
  const step = (x1 - x0) > 8 ? 2 : 1;
  for (let yr = x0; yr <= x1; yr += step) s += `<text x="${X(yr)}" y="${H - 8}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="var(--mono)">${yr}</text>`;
  if (proj) {
    const up = band.map(p => [p[0], p[3]]), dn = band.map(p => [p[0], p[1]]).reverse();
    s += `<path d="${path(up)} ${path(dn).replace("M", "L")} Z" fill="var(--brass)" fill-opacity=".12"/>`;
    s += `<path d="${path(band.map(p => [p[0], p[2]]))}" fill="none" stroke="var(--brass)" stroke-width="2" stroke-dasharray="5 5"/>`;
  }
  s += `<path d="${path(pts)} L${X(pts.at(-1)[0])} ${H - B} L${X(pts[0][0])} ${H - B} Z" fill="var(--good)" fill-opacity=".10"/>`;
  s += `<path d="${path(pts)}" fill="none" stroke="var(--good)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const e = pts.at(-1);
  s += `<circle cx="${X(e[0])}" cy="${Y(e[1])}" r="4.5" fill="var(--good)" stroke="var(--panel)" stroke-width="2"/>`;
  return s + "</svg>";
}
function spark(c) {
  const v = vals(c).slice(-6).map(p => p[1]); if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), W = 90, H = 26;
  const d = v.map((n, i) => (i ? "L" : "M") + (i / (v.length - 1) * W).toFixed(1) + " " + (H - 3 - (hi === lo ? 0.5 : (n - lo) / (hi - lo)) * (H - 6)).toFixed(1)).join(" ");
  const col = v.at(-1) >= v.at(-2) ? "var(--good)" : "var(--bad)";
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"/></svg>`;
}
function projection(c, years = 5) {
  const base = cur(c), y = vals(c).at(-1)[0], o = c.outlook || { bear: -3, base: 0, bull: 3 };
  const out = [[y, base, base, base]];
  for (let i = 1; i <= years; i++) out.push([y + i, base * (1 + o.bear / 100) ** i, base * (1 + o.base / 100) ** i, base * (1 + o.bull / 100) ** i]);
  return out;
}

  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Date", "Odometer km", "Type", "Title", "Notes", "Done by", "Cost AUD", "Battery V", "Tyre FL", "Tyre FR", "Tyre RL", "Tyre RR", "Oil", "Coolant", "Photos"]];
  sortedLog(c).forEach(x => { const r = x.readings || {}; rows.push([x.date, x.odo, x.type, x.title, x.notes, x.by, x.cost, r.battery, r.fl, r.fr, r.rl, r.rr, r.oil, r.coolant, (x.photos || []).length]); });
  return rows.map(r => r.map(q).join(",")).join("\r\n");
}
async function shrink(file) {
  const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode();
  const s = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
  cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
  return cv.toDataURL("image/jpeg", 0.82);
}

function route() {
  const h = location.hash.slice(1) || "portfolio";
  let html;
  if (OWNER_MODE && (h.startsWith("owner") || h === "add-car")) html = viewPortfolio();
  else if (h.startsWith("car-")) html = viewCar(h.slice(4));
  else if (h.startsWith("owner-")) html = viewOwner(h.slice(6));
  else if (h === "owners") html = viewOwners();
  else if (h === "logbook") html = viewLogbook();
  else if (h === "add-car") html = viewAddCar();
  else html = viewPortfolio();
  $("#app").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", h === a.dataset.nav || (a.dataset.nav === "owners" && h.startsWith("owner"))));
  document.querySelectorAll("[data-nav][aria-current]").forEach(a => a.setAttribute("aria-current", "page"));
}
function currentCar() { const h = location.hash.slice(1); return h.startsWith("car-") ? DB.cars.find(c => c.id === h.slice(4)) : null; }
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }
function commit(msg) { route(); toast(msg); save(); }
const uid = p => p + Date.now().toString(36);

const HANDLERS = {
  value(f, c) { const y = +f.year, v = +f.value; c.values = c.values.filter(p => p[0] !== y).concat([[y, v]]).sort((a, b) => a[0] - b[0]); return "Valuation saved"; },
  outlook(f, c) { c.outlook = { bear: +f.bear, base: +f.base, bull: +f.bull }; return "Outlook updated"; },
  highlight(f, c) { (c.highlights ||= []).push(f.text); return "Highlight added"; },
  due(f, c) { c.due = { service: f.service, rego: f.rego, insurance: f.insurance }; return "Dates saved"; },
  async log(f, c, el) {
    const files = [...(el.querySelector('input[type="file"]')?.files || [])].slice(0, 6);
    const photos = []; for (const file of files) { try { photos.push(await storePhoto(file, c.id)); } catch (e) {} }
    const r = { battery: f.r_battery, fl: f.r_fl, fr: f.r_fr, rl: f.r_rl, rr: f.r_rr, oil: f.r_oil, coolant: f.r_coolant };
    const hasR = Object.values(r).some(v => v !== "" && v !== undefined);
    (c.log ||= []).push({ id: uid("l"), date: f.date, odo: +f.odo || c.odo, type: f.type, title: f.title, notes: f.notes, cost: +f.cost || 0, by: f.by, ...(hasR ? { readings: r } : {}), ...(photos.length ? { photos } : {}) });
    if (+f.odo > c.odo) c.odo = +f.odo;
    LOGF = "All";
    return `Logbook entry added${photos.length ? " with " + photos.length + " photo" + (photos.length > 1 ? "s" : "") : ""}`;
  },
  issue(f, c) { (c.issues ||= []).unshift({ date: f.date, title: f.title, severity: f.severity, status: "Open" }); return "Issue logged"; },
  async photo(f, c, el) {
    const files = [...(el.querySelector('input[type="file"]')?.files || [])].slice(0, 10);
    let n = 0; for (const file of files) { try { (c.photos ||= []).push(await storePhoto(file, c.id)); n++; } catch (e) {} }
    return n ? `${n} photo${n > 1 ? "s" : ""} added` : "Choose one or more photos first";
  },
  comp(f, c) { (c.comps ||= []).unshift({ date: f.date, desc: f.desc, km: +f.km || 0, price: +f.price, source: f.source }); return "Comparable sale added"; },
  async owner(f) { const id = crypto.randomUUID(); DB.owners.push({ id, since: iso, ...f }); await save(); const { data } = await sb.from("owners").select("share_token").eq("id", id).single(); DB.owners.find(o => o.id === id).share_token = data?.share_token; location.hash = "owner-" + id; return "Owner added"; },
  ownerEdit(f) { const o = owner(location.hash.slice(7)); Object.assign(o, f); return "Owner details saved"; },
  car(f) {
    const id = crypto.randomUUID(), y = TODAY.getFullYear();
    DB.cars.push({ id, ownerId: f.ownerId, year: +f.year, make: f.make, model: f.model, variant: f.variant, colour: f.colour, rego: f.rego, vin: f.vin, odo: +f.odo || 0,
      purchase: { date: f.pdate, price: +f.pprice }, specs: { hp: +f.hp || 0, kw: Math.round((+f.hp || 0) * 0.7457), weight: +f.weight || 0, zero100: +f.zero100 || "—", engine: f.engine, gearbox: f.gearbox, top: +f.top || "—" },
      values: [[+f.pdate.slice(0, 4), +f.pprice], [y, +f.value]].filter((p, i, a) => i === 0 || p[0] !== a[0][0]), outlook: { bear: -4, base: 0, bull: 4 },
      highlights: [], due: {}, log: [], issues: [], comps: [] });
    location.hash = "car-" + id; return "Car added";
  }
};

document.addEventListener("submit", async e => {
  const h = e.target.dataset.h; if (!HANDLERS[h]) return;
  e.preventDefault();
  const fd = new FormData(e.target); fd.delete("photos");
  const f = Object.fromEntries(fd);
  const btn = e.target.querySelector("[type=submit]"); if (btn) btn.disabled = true;
  try { commit(await HANDLERS[h](f, currentCar(), e.target)); } catch (err) { console.error(err); toast("Something went wrong: " + (err.message || "please try again")); if (btn) btn.disabled = false; }
});
document.addEventListener("change", e => { if (e.target.id === "logcar") { LOGCAR = e.target.value; route(); } });
$("#lightbox").addEventListener("click", e => e.currentTarget.hidden = true);
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#lightbox").hidden = true; });
document.addEventListener("click", e => {
  const lf = e.target.closest("[data-logf]"); if (lf) { LOGF = lf.dataset.logf; route(); return; }
  if (e.target.matches("[data-photo]")) { const lb = $("#lightbox"); lb.querySelector("img").src = e.target.src; lb.hidden = false; return; }
  const csv = e.target.closest("[data-csv]");
  if (csv) {
    const c = DB.cars.find(x => x.id === csv.dataset.csv);
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob(["﻿" + csvFor(c)], { type: "text/csv" })), download: `${carName(c)} logbook ${iso}.csv` });
    a.click(); URL.revokeObjectURL(a.href); toast("Logbook exported"); return;
  }
  const cov = e.target.closest("[data-cover]");
  if (cov) { const c = currentCar(), i = +cov.dataset.cover; c.photos.unshift(...c.photos.splice(i, 1)); commit("Cover photo changed"); return; }
  const dp = e.target.closest("[data-delphoto]");
  if (dp) {
    if (dp.dataset.armed) { const c = currentCar(); removeStored(c.photos.splice(+dp.dataset.delphoto, 1)[0]).catch(() => {}); commit("Photo removed"); }
    else { dp.dataset.armed = 1; dp.textContent = "Remove?"; }
    return;
  }
  const del = e.target.closest("[data-dellog]");
  if (del) {
    if (del.dataset.armed) { const c = currentCar(); c.log = c.log.filter(x => x.id !== del.dataset.dellog); commit("Entry deleted"); }
    else { del.dataset.armed = 1; del.textContent = "Delete?"; }
    return;
  }
  const go = e.target.closest("[data-go]"); if (go && !e.target.closest("a,button")) location.hash = go.dataset.go;
  const iss = e.target.closest("[data-issue]");
  if (iss) { const c = currentCar(), i = c.issues[+iss.dataset.issue]; i.status = i.status === "Open" ? "Fixed" : "Open"; commit(i.status === "Fixed" ? "Marked fixed" : "Reopened"); }
  if (e.target.id === "del-car") {
    if (e.target.dataset.armed) { const c = currentCar(); DB.cars = DB.cars.filter(x => x !== c); location.hash = "portfolio"; commit("Car removed"); }
    else { e.target.dataset.armed = 1; e.target.textContent = "Click again to remove"; }
  }
});
document.addEventListener("keydown", e => { const go = e.target.closest?.("[data-go]"); if (go && e.key === "Enter") location.hash = go.dataset.go; });

$("#export").onclick = () => {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `private-spanner-garage-${iso}.json` });
  a.click(); URL.revokeObjectURL(a.href); toast("Data exported");
};
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
if (new URLSearchParams(location.search).has("showcase")) document.body.classList.add("showcase");
document.addEventListener("click", async e => {
  if (e.target.closest("[data-copylink]")) {
    const inp = $("#owner-link");
    try { await navigator.clipboard.writeText(inp.value); toast("Link copied"); } catch { inp.select(); toast("Link selected. Press Ctrl+C to copy."); }
  }
  const rot = e.target.closest("[data-rotate]");
  if (rot) {
    if (!rot.dataset.armed) { rot.dataset.armed = 1; rot.textContent = "Replace link? The old one will stop working. Click again to confirm."; return; }
    const { data, error } = await sb.rpc("rotate_share_token", { owner: rot.dataset.rotate });
    if (error) return toast("Couldn't replace the link.");
    owner(rot.dataset.rotate).share_token = data; route(); toast("New link created. The old one no longer works.");
  }
});
start();
</script>
</body>
</html>
